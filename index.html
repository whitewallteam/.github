<!DOCTYPE html>
<html lang="cn">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <title>RunAway Script API</title>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
        name: 'RunAway',
        subMaxLevel: 3,
        search: {
            maxAge: 86400000,
            paths: 'auto', // or 'auto'
            placeholder: '请输入搜索内容',
            noData: '未搜索到结果',
            depth: 3,
            hideOtherSidebarContent: false,
            namespace: 'docs.netease.dev',
            pathNamespaces: ['/'],
        },
        copyCode: {
            buttonText: '点击复制',
            errorText: '错误',
            successText: '复制成功',
        },
        //loadNavbar: 'nav.md',
        loadSidebar: 'summary.md'
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
